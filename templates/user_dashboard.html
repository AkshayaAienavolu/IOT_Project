<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - {{ user_id }}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        h1 {
            color: #333;
            font-size: 2em;
            flex: 1;
        }
        
        .user-id-display {
            font-size: 0.9em;
            color: #667eea;
            font-family: monospace;
            background: #667eea15;
            padding: 8px 15px;
            border-radius: 20px;
            margin-top: 10px;
            display: inline-block;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .summary {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 20px;
            margin-bottom: 30px;
            border-radius: 10px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 0.9em;
            line-height: 1.6;
        }
        
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 30px;
            margin-top: 30px;
        }
        
        .chart-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
        }
        
        .chart-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }
        
        .chart-title {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 20px;
            font-size: 1.1em;
            font-weight: 600;
        }
        
        .chart-image {
            width: 100%;
            height: auto;
            display: block;
        }
        
        .no-charts {
            text-align: center;
            padding: 60px 20px;
            color: #666;
            font-size: 1.2em;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            .header {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .charts-grid {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>📊 My Dashboard</h1>
                <div class="user-id-display">{{ user_id }}</div>
            </div>
            <div class="controls">
                <!-- Show "Back to Users" only when accessed from server root (admin) -->
                <a href="/" class="btn admin-only" id="backBtn" style="display:none;">← Back to Users</a>
                <button class="btn" id="refreshBtn" onclick="refreshDashboard()">🔄 Refresh</button>
                <span id="refreshStatus" style="margin-left: 10px; color: #666; font-size: 0.9em;"></span>
            </div>
        </div>
        
        {% if summary %}
        <div class="summary">{{ summary }}</div>
        {% endif %}
        
        {% if charts %}
        <div class="charts-grid">
            {% for chart in charts %}
            <div class="chart-card">
                <div class="chart-title">{{ chart.name }}</div>
                <img src="{{ chart.url }}" alt="{{ chart.name }}" class="chart-image">
            </div>
            {% endfor %}
        </div>
        {% else %}
        <div class="no-charts">
            <p>No charts available for this user.</p>
            <p style="margin-top: 10px; font-size: 0.9em;">Click "Regenerate Dashboards" on the main page.</p>
        </div>
        {% endif %}
    </div>
    
    <script>
        async function refreshDashboard() {
            const btn = document.getElementById('refreshBtn');
            const status = document.getElementById('refreshStatus');
            
            // Disable button and show loading
            btn.disabled = true;
            btn.textContent = '⏳ Refreshing...';
            status.textContent = 'Regenerating dashboards...';
            
            try {
                // Trigger dashboard regeneration
                const response = await fetch('/api/regenerate', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'}
                });
                
                const result = await response.json();
                
                if (result.success) {
                    status.textContent = '✓ Updated! Reloading...';
                    setTimeout(() => location.reload(), 1000);
                } else {
                    status.textContent = '✗ Update failed';
                    btn.disabled = false;
                    btn.textContent = '🔄 Refresh';
                }
            } catch (error) {
                status.textContent = '✗ Error: ' + error.message;
                btn.disabled = false;
                btn.textContent = '🔄 Refresh';
            }
        }
        
        // Auto-refresh page every 2 minutes to show latest data
        setTimeout(() => {
            location.reload();
        }, 120000); // 2 minutes
        
        // Show "Back to Users" button only when accessed from local server (admin)
        // Hide it when accessed from external/camera app links
        window.addEventListener('DOMContentLoaded', function() {
            const backBtn = document.getElementById('backBtn');
            const referrer = document.referrer;
            
            // Show back button if came from the main dashboard page (server admin)
            const fromMainDashboard = referrer.includes('5000/') && !referrer.includes('/user/');
            
            if (fromMainDashboard || referrer === '') {
                backBtn.style.display = 'inline-block';
            }
        });
    </script>
</body>
</html>
