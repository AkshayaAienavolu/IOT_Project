<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#1f6feb" />
    <meta name="description" content="Your Personal Emotion Dashboard" />
    <title>My Dashboard - FER Mobile</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .dashboard-container {
        max-width: 1400px;
        margin: 20px auto;
        padding: 20px;
      }

      .dashboard-header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 30px;
        border-radius: 15px;
        margin-bottom: 30px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }

      .dashboard-header h1 {
        margin: 0 0 10px 0;
        font-size: 2em;
      }

      .user-id-badge {
        background: rgba(255, 255, 255, 0.2);
        padding: 8px 15px;
        border-radius: 20px;
        display: inline-block;
        font-family: monospace;
        font-size: 0.9em;
        margin-top: 10px;
      }

      .nav-buttons {
        margin-bottom: 20px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }
      
      .refresh-info {
        color: rgba(255, 255, 255, 0.7);
        font-size: 0.85em;
        margin-left: auto;
      }

      .nav-btn {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        padding: 12px 25px;
        border-radius: 25px;
        font-size: 16px;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
        font-weight: 600;
        text-decoration: none;
        display: inline-block;
      }

      .nav-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
      }

      .nav-btn.secondary {
        background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      }

      .charts-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
        gap: 25px;
        margin-top: 20px;
      }

      .chart-card {
        background: white;
        border-radius: 15px;
        overflow: hidden;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        transition: transform 0.3s;
      }

      .chart-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      }

      .chart-title {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 15px 20px;
        font-size: 1.1em;
        font-weight: 600;
      }

      .chart-image {
        width: 100%;
        height: auto;
        display: block;
        background: #f8f9fa;
      }

      .summary-card {
        background: white;
        border-radius: 15px;
        padding: 25px;
        margin-bottom: 30px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        border-left: 5px solid #667eea;
      }

      .summary-card h2 {
        color: #333;
        margin-bottom: 15px;
        font-size: 1.5em;
      }

      .summary-text {
        white-space: pre-wrap;
        font-family: 'Courier New', monospace;
        font-size: 0.95em;
        line-height: 1.8;
        color: #555;
      }

      .loading-state {
        text-align: center;
        padding: 60px 20px;
        color: #667eea;
        font-size: 1.2em;
      }

      .error-state {
        background: #f8d7da;
        color: #721c24;
        padding: 20px;
        border-radius: 10px;
        border: 1px solid #f5c6cb;
        margin: 20px 0;
      }

      .no-data-state {
        text-align: center;
        padding: 60px 20px;
        background: #fff3cd;
        color: #856404;
        border-radius: 15px;
        border: 2px dashed #ffc107;
      }
      
      .no-data-state h2 {
        margin-top: 0;
      }
      
      .no-data-state ol {
        text-align: left;
        display: inline-block;
        margin: 15px auto;
        padding-left: 20px;
      }
      
      .no-data-state li {
        margin: 8px 0;
        line-height: 1.6;
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 15px;
        margin-bottom: 30px;
      }

      .stat-box {
        background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
        padding: 20px;
        border-radius: 10px;
        text-align: center;
      }

      .stat-value {
        font-size: 2em;
        font-weight: 700;
        color: #667eea;
        display: block;
      }

      .stat-label {
        color: #666;
        font-size: 0.9em;
        margin-top: 5px;
      }

      @media (max-width: 768px) {
        .charts-grid {
          grid-template-columns: 1fr;
        }

        .dashboard-header h1 {
          font-size: 1.5em;
        }

        .stats-grid {
          grid-template-columns: 1fr 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="dashboard-container">
      <div class="dashboard-header">
        <h1>📊 My Emotion Dashboard</h1>
        <p>View your personal emotion analytics</p>
        <div class="user-id-badge" id="userIdDisplay">Loading...</div>
      </div>

      <div class="nav-buttons">
        <a id="backToCameraBtn" href="#" class="nav-btn">← Back to Camera</a>
        <button class="nav-btn secondary" onclick="refreshDashboard()">🔄 Refresh Now</button>
        <span class="refresh-info" id="refreshInfo">Auto-refresh: Every 2 min</span>
      </div>

      <div id="dashboardContent">
        <div class="loading-state">
          <p>Loading your dashboard...</p>
          <p style="font-size: 0.8em; margin-top: 10px;">Please wait while we fetch your data</p>
        </div>
      </div>
    </div>

    <!-- MQTT Client Scripts -->
    <script src="https://unpkg.com/mqtt@5.3.0/dist/mqtt.min.js"></script>
    <script src="mqtt_config.js?v=7"></script>
    <script src="mqtt_client.js?v=7"></script>
    <script>
      // Force ID migration immediately on page load
      console.log('[Dashboard] Checking client ID migration...');
      
      // Use the same client ID logic as main app (imported from mqtt_client.js)
      let userId = '';
      try {
        // ensureClientId is exported by mqtt_client.js
        userId = window.ensureClientId ? window.ensureClientId() : 'unknown';
        console.log('[Dashboard] Client ID obtained:', userId);
        
        // Verify ID format
        if (userId.startsWith('fer_web_') && !userId.startsWith('fer_webapp_')) {
          console.warn('[Dashboard] Old ID format detected! Migration should have happened.');
        } else if (userId.startsWith('fer_webapp_')) {
          console.log('[Dashboard] ✓ Correct ID format');
        }
      } catch (e) {
        console.error('Failed to get client ID:', e);
        userId = 'error_' + Math.random().toString(16).slice(2, 10);
      }

      // Check for user_id in URL params to override/set ID
      const urlParams = new URLSearchParams(window.location.search);
      const paramId = urlParams.get('user_id');
      if (paramId) {
          console.log('[Dashboard] Setting ID from URL:', paramId);
          userId = paramId;
          // Persist it
          try {
              localStorage.setItem('fer_client_id', userId);
              document.cookie = `fer_client_id=${userId}; path=/; max-age=31536000; SameSite=Strict`;
              // Update config if it exists
              if (window.MQTT_CONFIG) window.MQTT_CONFIG.CLIENT_ID = userId;
          } catch(e) { console.error('Failed to save ID', e); }
      }
      
      document.getElementById('userIdDisplay').textContent = userId;

      // Dashboard API base URL
      // If served from the dashboard server (port 5000), use current origin.
      // Otherwise, fallback to localhost:5000 or the Pi IP.
      let DASHBOARD_API = 'http://localhost:5000';
      if (window.location.port === '5000') {
        DASHBOARD_API = window.location.origin;
      } else if (window.location.protocol === 'file:') {
        // Keep default or use a known IP if needed
        // DASHBOARD_API = 'http://10.221.24.195:5000'; 
      }
      console.log('[Dashboard] Using API:', DASHBOARD_API);
      
      // Helper: Check if browser allows local network access
      function checkNetworkPermission() {
        // Check for Mixed Content (HTTPS -> HTTP)
        if (window.location.protocol === 'https:' && DASHBOARD_API.startsWith('http:')) {
            console.warn('Mixed Content Warning: Cannot fetch HTTP API from HTTPS page.');
            return false;
        }
        return true; 
      }

      async function loadDashboard() {
        const contentDiv = document.getElementById('dashboardContent');
        
        // Check for Mixed Content issue immediately
        if (!checkNetworkPermission()) {
             contentDiv.innerHTML = `
                <div class="error-state">
                  <h3>🔒 Security Restriction</h3>
                  <p>You are viewing this page via <strong>HTTPS</strong> (Netlify), but the dashboard server is on <strong>HTTP</strong> (Raspberry Pi).</p>
                  <p>Browsers block this connection for security.</p>
                  <p style="margin-top: 15px;"><strong>Solution:</strong></p>
                  <ul style="text-align: left; display: inline-block; margin: 10px auto;">
                    <li>Use the local dashboard served by your Pi: <br>
                        <a href="http://${DASHBOARD_API.split('//')[1]}/my-dashboard" style="color: #721c24; font-weight: bold;">
                            http://${DASHBOARD_API.split('//')[1]}/my-dashboard
                        </a>
                    </li>
                  </ul>
                </div>
              `;
              return;
        }

        try {
          // Fetch user's summary
          const response = await fetch(`${DASHBOARD_API}/api/user/${userId}/summary`);
          
          if (!response.ok) {
            if (response.status === 404) {
              contentDiv.innerHTML = `
                <div class="no-data-state">
                  <h2>📊 No Data Yet</h2>
                  <p>Start using the camera for 30-60 seconds to collect emotion data!</p>
                  <p style="margin-top: 10px; font-size: 0.9em; color: #666;">
                    Make sure to:<br>
                    ✓ Allow camera access<br>
                    ✓ Look at the camera with your face visible<br>
                    ✓ Stay connected to WiFi<br>
                    ✓ Wait a few minutes for data processing
                  </p>
                  <p style="margin-top: 15px;">
                    <a href="index.html" class="nav-btn">Go to Camera →</a>
                  </p>
                </div>
              `;
              return;
            }
            throw new Error(`Server returned ${response.status}`);
          }

          const data = await response.json();
          
          // Update userId if server matched to a different ID (handles format mismatches)
          if (data.used_user_id && data.used_user_id !== userId) {
            console.log(`Server matched ${userId} to ${data.used_user_id}`);
            userId = data.used_user_id;
            document.getElementById('userIdDisplay').textContent = userId + ' (matched)';
          }

          // Build dashboard HTML
          let html = '';

          // Stats summary
          if (data.stats) {
            html += `
              <div class="stats-grid">
                <div class="stat-box">
                  <span class="stat-value">${data.stats.total_events}</span>
                  <span class="stat-label">Total Events</span>
                </div>
                <div class="stat-box">
                  <span class="stat-value">${data.stats.top_emotion}</span>
                  <span class="stat-label">Most Common</span>
                </div>
                <div class="stat-box">
                  <span class="stat-value">${data.stats.avg_confidence}%</span>
                  <span class="stat-label">Avg Confidence</span>
                </div>
                <div class="stat-box">
                  <span class="stat-value">${data.stats.days_active}</span>
                  <span class="stat-label">Days Active</span>
                </div>
              </div>
            `;
          }

          // Summary text
          if (data.summary) {
            html += `
              <div class="summary-card">
                <h2>📈 Summary</h2>
                <div class="summary-text">${data.summary}</div>
              </div>
            `;
          }

          // Charts
          if (data.charts && data.charts.length > 0) {
            html += '<div class="charts-grid">';
            const timestamp = new Date().getTime(); // Cache buster
            data.charts.forEach(chart => {
              html += `
                <div class="chart-card">
                  <div class="chart-title">${chart.name}</div>
                  <img src="${DASHBOARD_API}${chart.url}?t=${timestamp}" 
                       alt="${chart.name}" 
                       class="chart-image"
                       onerror="this.parentElement.innerHTML='<div style=padding:40px;text-align:center;color:#999>Chart not available</div>'">
                </div>
              `;
            });
            html += '</div>';
          } else {
            html += `
              <div class="no-data-state">
                <p>No charts available yet. Charts are generated every 5 minutes.</p>
                <p style="margin-top: 10px;">
                  <button class="nav-btn" onclick="refreshDashboard()">Refresh Dashboard</button>
                </p>
              </div>
            `;
          }

          contentDiv.innerHTML = html;

        } catch (error) {
          console.error('Error loading dashboard:', error);
          
          // Detect common error types
          let errorHelp = '';
          if (error.message.includes('Failed to fetch') || error.name === 'TypeError') {
            errorHelp = `
              <h3>🔒 Network Permission Issue</h3>
              <p><strong>Please allow local network access for this site:</strong></p>
              <ol style="text-align: left; display: inline-block; margin: 15px auto;">
                <li><strong>iPhone/iPad:</strong> Settings → Safari → scroll to this site → Allow local network access</li>
                <li><strong>Android Chrome:</strong> Site settings → Permissions → Allow access to devices on local network</li>
                <li><strong>Desktop:</strong> Check firewall settings and ensure you're on the same WiFi as the Pi</li>
              </ol>
              <p style="margin-top: 15px;">Also verify:<br>
                ✓ Dashboard server is running on Pi: <code>python3 dashboard_server.py</code><br>
                ✓ You're connected to the same WiFi network as the Pi<br>
                ✓ Pi IP address is correct: <code>${DASHBOARD_API}</code>
              </p>
            `;
          } else {
            errorHelp = `
              <h3>⚠️ Unable to Load Dashboard</h3>
              <p>Error: ${error.message}</p>
              <p style="margin-top: 15px;">
                Make sure the dashboard server is running on your Raspberry Pi.<br>
                Update the <code>DASHBOARD_API</code> URL in this page with your Pi's IP address.
              </p>
            `;
          }
          
          contentDiv.innerHTML = `
            <div class="error-state">
              ${errorHelp}
              <p style="margin-top: 20px;">
                <button class="nav-btn" onclick="refreshDashboard()">Try Again</button>
              </p>
            </div>
          `;
        }
      }

      function refreshDashboard() {
        document.getElementById('dashboardContent').innerHTML = `
          <div class="loading-state">
            <p>Regenerating charts with latest data...</p>
            <p style="font-size: 0.85em; margin-top: 10px;">This may take a few seconds...</p>
          </div>
        `;
        
        // Trigger server-side chart regeneration first
        const apiUrl = DASHBOARD_API + '/api/regenerate';
        fetch(apiUrl)
          .then(response => response.json())
          .then(result => {
            console.log('Regeneration result:', result);
            // Wait a moment for files to be written, then reload dashboard
            setTimeout(loadDashboard, 1000);
          })
          .catch(error => {
            console.warn('Regeneration API failed, loading anyway:', error);
            // Even if API fails, try to load dashboard
            setTimeout(loadDashboard, 500);
          });
      }

      // Load dashboard on page load
      window.addEventListener('load', loadDashboard);

      // Auto-refresh every 2 minutes (120000ms)
      setInterval(refreshDashboard, 120000);
      
      // Show last refresh time
      function updateRefreshTime() {
        const now = new Date().toLocaleTimeString();
        const refreshInfo = document.getElementById('refreshInfo');
        if (refreshInfo) {
          refreshInfo.textContent = `Last updated: ${now}`;
        }
      }
      
      // Update refresh time after each load
      const originalLoadDashboard = loadDashboard;
      loadDashboard = function() {
        originalLoadDashboard();
        updateRefreshTime();
      };

      // Fix "Back to Camera" link to point to Netlify (HTTPS)
      // This prevents the user from going back to the HTTP version of the camera which fails
      const NETLIFY_URL = 'https://iotprojectfer.netlify.app/';
      const backBtn = document.getElementById('backToCameraBtn');
      if (backBtn) {
          // Append user_id to ensure identity persists when switching back to HTTPS
          const targetUrl = `${NETLIFY_URL}?user_id=${userId}`;
          backBtn.href = targetUrl;
          backBtn.onclick = function(e) {
              e.preventDefault();
              window.location.href = targetUrl;
          };
      }
    </script>
  </body>
</html>
