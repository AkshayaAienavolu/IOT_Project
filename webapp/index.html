<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#1f6feb" />
    <meta name="description" content="Cross-Dataset Facial Emotion Recognition - Runs entirely on your device" />
    <title>FER Mobile - Cross-Dataset Emotion Recognition</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="manifest" href="manifest.json" />
    <!-- TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.14.0/dist/tf.min.js"></script>
    <!-- MediaPipe drawing & camera utils (v0.4) -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.4/drawing_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.4/camera_utils.js"></script>
    <!-- MediaPipe Face Detection v0.4 -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection@0.4/face_detection.js"></script>
  </head>
  <body>
    <main>
      <header>
        <h1>🎭 FER Mobile</h1>
        <p class="subtitle">Cross-Dataset Ensemble • On-Device • No Server</p>
      </header>

      <div class="video-wrap">
        <video id="video" playsinline autoplay muted></video>
        <canvas id="overlay"></canvas>
        <canvas id="faceCanvas"></canvas>
      </div>

      <div class="controls">
        <button id="startBtn">▶ Start Camera</button>
        <button id="stopBtn" disabled>⏹ Stop</button>
        <a id="dashboardBtn" href="#" target="_blank" style="display: inline-block; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 12px 25px; border-radius: 25px; text-decoration: none; font-weight: 600; margin-left: 10px;">📊 My Dashboard</a>
      </div>

      <div id="status" class="status">Initializing...</div>

      <div class="predictions">
        <h2>Emotion Predictions</h2>
        <div id="predList">—</div>
        <div class="ensemble-info">
          <small>✓ Cross-Dataset: ImageNet (14M) + FER2013 (35K)</small>
        </div>
      </div>

      <div class="install-prompt" id="installPrompt" style="display: none;">
        <p>📱 Install this app for better experience</p>
        <button id="installBtn">Install App</button>
      </div>

      <!-- User Identity Management -->
      <div style="margin-top: 30px; padding: 15px; background: #1a1a1a; border-radius: 12px; text-align: center; border: 1px solid #333;">
        <p style="margin: 0 0 10px 0; color: #8b949e; font-size: 0.9em;">
          User ID: <span id="dispUserId" style="font-family: monospace; color: #58a6ff;">...</span>
        </p>
        <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
            <button onclick="copyUserLink()" style="background: #238636; color: white; border: none; padding: 8px 16px; border-radius: 20px; font-size: 0.85em; cursor: pointer;">
              📋 Copy My Link
            </button>
            <button onclick="restoreUser()" style="background: #30363d; color: #c9d1d9; border: 1px solid #8b949e; padding: 8px 16px; border-radius: 20px; font-size: 0.85em; cursor: pointer;">
              🔄 Restore ID
            </button>
        </div>
        <p style="margin: 10px 0 0 0; font-size: 0.75em; color: #666;">
          Save your link to keep your history if you clear browser data.
        </p>
      </div>
    </main>

    <!-- MQTT client (browser) - add credentials by copying mqtt_config.example.js -> mqtt_config.js -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="mqtt_config.js?v=6" defer></script>
    <script src="mqtt_client.js?v=6" defer></script>
    <script src="app.js?v=6"></script>
    <script>
      // Configuration: Set your Raspberry Pi IP here
      const PI_IP = '10.221.24.195'; 
      const PI_PORT = '5000';

      // Initialize MQTT connection on page load
      window.addEventListener('load', function() {
        // 1. Init MQTT
        if (typeof window.initMqtt === 'function') {
          window.initMqtt();
          console.log('MQTT client initialized');
        } else {
          console.warn('initMqtt not available - check mqtt_client.js loaded');
        }

        // 2. Update Dashboard Link with User ID and Pi IP
        const btn = document.getElementById('dashboardBtn');
        if (btn) {
            // Get ID from mqtt_client logic or storage
            let userId = 'unknown';
            try {
                if (window.ensureClientId) {
                    userId = window.ensureClientId();
                } else {
                    userId = localStorage.getItem('fer_client_id') || 'unknown';
                }
            } catch(e) { console.error(e); }

            // Construct URL: http://<PI_IP>:5000/my-dashboard?user_id=<ID>
            // We use the Pi's HTTP server directly to avoid Mixed Content issues
            const dashboardUrl = `http://${PI_IP}:${PI_PORT}/my-dashboard?user_id=${userId}`;
            btn.href = dashboardUrl;
            console.log('Dashboard Link set to:', dashboardUrl);

            // Update Display ID
            const disp = document.getElementById('dispUserId');
            if (disp) disp.textContent = userId;
        }
      });

      function copyUserLink() {
        const userId = document.getElementById('dispUserId').textContent;
        const url = `${window.location.origin}${window.location.pathname}?user_id=${userId}`;
        navigator.clipboard.writeText(url).then(() => {
            alert('Link copied! Save this link to access your account later.');
        }).catch(err => {
            prompt('Copy this link to save your ID:', url);
        });
      }

      function restoreUser() {
        const current = document.getElementById('dispUserId').textContent;
        const input = prompt('Enter your User ID to restore:', current);
        if (input && input !== current) {
            // Save to storage
            localStorage.setItem('fer_client_id', input);
            document.cookie = `fer_client_id=${input}; path=/; max-age=31536000; SameSite=Lax`;
            // Reload to apply
            window.location.href = `${window.location.origin}${window.location.pathname}?user_id=${input}`;
        }
      }
    </script>
  </body>
</html>
